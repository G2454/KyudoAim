name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' gradlew scripts/*.sh
          chmod +x gradlew

      - name: Show Kotlin compiler errors as annotations
        run: echo "::add-matcher::ci/kotlin-problem-matcher.json"

      - name: Unit tests (JVM + Robolectric, includes screenshot smoke tests)
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log; exit ${PIPESTATUS[0]}

      - name: Report failures as annotations
        if: failure()
        run: python3 ci/report_failures.py

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: kyudo-aim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            gradle-*.log
          if-no-files-found: ignore
