name: Android CI

# Tests (JVM + Robolectric + UI), coverage, debug APK and lint.
# The steps live in ci/android-checks.sh, so changing them doesn't need a workflow edit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, coverage, APK, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare scripts
        run: |
          sed -i 's/\r$//' gradlew scripts/*.sh ci/*.sh
          chmod +x gradlew scripts/*.sh ci/*.sh

      - name: Show Kotlin compiler errors as annotations
        run: echo "::add-matcher::ci/kotlin-problem-matcher.json"

      - name: Run all checks
        run: bash ci/android-checks.sh

      - name: Report failures as annotations
        if: failure()
        run: python3 ci/report_failures.py

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kyudo-aim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            gradle-*.log
          if-no-files-found: ignore
