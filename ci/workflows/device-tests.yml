name: Device tests

# Runs app/src/androidTest on an Android 11 emulator: app launch, every screen, the real
# camera + pose model + recorder, video trimming on a real MP4, gallery saving and sharing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare scripts
        run: |
          sed -i 's/\r$//' gradlew scripts/*.sh ci/*.sh
          chmod +x gradlew scripts/*.sh ci/*.sh

      - name: Enable KVM for a fast emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Show Kotlin compiler errors as annotations
        run: echo "::add-matcher::ci/kotlin-problem-matcher.json"

      - name: Build the app and the device tests
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest 2>&1 | tee gradle-build.log; exit ${PIPESTATUS[0]}

      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash ci/device-tests.sh

      - name: Report failures as annotations
        if: failure()
        run: python3 ci/report_failures.py

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            gradle-*.log
          if-no-files-found: ignore
