name: README screenshots

# Renders every screen with demo data (Robolectric + Roborazzi, no emulator needed)
# and commits the PNGs in docs/screenshots/ when they changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/src/test/java/com/kyudo/aimhelper/screenshots/**"
      - "app/build.gradle.kts"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' gradlew scripts/*.sh
          chmod +x gradlew

      - name: Show Kotlin compiler errors as annotations
        run: echo "::add-matcher::ci/kotlin-problem-matcher.json"

      - name: Record screenshots
        run: bash scripts/screenshots.sh 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}

      - name: Report failures as annotations
        if: failure()
        run: python3 ci/report_failures.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore

      - name: Commit screenshots if they changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
